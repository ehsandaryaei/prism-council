name: Bug report
description: The skill did not trigger, ran incorrectly, or produced a broken report.
labels: [bug]
body:
  - type: input
    id: host
    attributes:
      label: Agent and version
      placeholder: "e.g. Claude Code 2.1.x, Codex CLI, Cursor 2.x, Gemini CLI"
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Which mode ran?
      options:
        - Isolated subagents
        - Single-context simulation
        - Not sure
    validations:
      required: true
  - type: textarea
    id: prompt
    attributes:
      label: Prompt you used
      description: Remove anything confidential.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What went wrong
      description: Expected versus actual. Paste the relay output if you can.
    validations:
      required: true
  - type: input
    id: install
    attributes:
      label: Install command
      placeholder: "npx skills add ehsandaryaei/prism-council ..."
